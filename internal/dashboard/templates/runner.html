{{define "title"}}{{or .Runner.Original .Runner.Name "New runner"}}{{end}}

{{define "content"}}
{{with .Runner}}
<div class="page-head">
  <div>
    <p class="crumb"><a href="/runners">Runners</a> /</p>
    <h1>{{or .Original .Name "New runner"}}</h1>
  </div>
</div>

<form method="post" action="/runners" class="form" hx-push-url="false">
  <input type="hidden" name="original" value="{{.Original}}">

  <fieldset>
    <legend>Runner</legend>
    <div class="grid">
      <label>Name <input name="name" value="{{.Name}}" required placeholder="claude" autocomplete="off">
        <small>Agents pick it by this name.</small></label>
      <label>Type
        <select name="type">{{range $.RunnerTypes}}<option{{if eq . $.Runner.Type}} selected{{end}}>{{.}}</option>{{end}}</select>
        <small>The CLI it drives.</small></label>
      <label>Command <input name="command" value="{{.Command}}" placeholder="the type's usual binary">
        <small>An executable on PATH, or a path.</small></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Defaults for its agents</legend>
    <div class="grid">
      <label>Model <input name="model" value="{{.Model}}" list="models" placeholder="the CLI's default"></label>
      <label>Max turns <input name="max_turns" value="{{.MaxTurns}}" inputmode="numeric" placeholder="30"></label>
      <label>Timeout <input name="timeout" value="{{.Timeout}}" placeholder="15m"></label>
    </div>
    <datalist id="models"><option value="haiku"><option value="sonnet"><option value="opus"></datalist>
  </fieldset>

  <fieldset>
    <legend>Process</legend>
    <div class="grid">
      <label class="span2">Extra arguments <textarea name="args" rows="3" class="mono" placeholder="One argument per line">{{.Args}}</textarea>
        <small>Added to every run.</small></label>
      <label class="span2">Environment <textarea name="env" rows="3" class="mono" placeholder="KEY=value">{{.Env}}</textarea>
        <small>One <code>KEY=value</code> per line, added to the CLI's environment.</small></label>
    </div>
  </fieldset>

  <div class="actions">
    <button class="btn primary">Save runner</button>
    <a class="btn ghost" href="/runners">Cancel</a>
  </div>
</form>
{{end}}
{{end}}
